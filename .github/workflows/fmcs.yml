name: fmcs
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'recon | full'
        default: 'recon'

jobs:
  emu:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -al /dev/kvm

      - name: Download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1 -R "$GITHUB_REPOSITORY" --clobber

      - name: Run emulator + flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 3072M
          script: |
            mkdir -p ui
            python3 driver/fms_ui.py "${{ inputs.mode }}"

      - name: Upload UI dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-dumps
          path: |
            ui/
            logcat.txt
