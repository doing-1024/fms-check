name: fmcs
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'recon | full'
        default: 'recon'

jobs:
  emu:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -al /dev/kvm

      - name: Download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1 -R "$GITHUB_REPOSITORY" --clobber
          # 静态 curl 给 guest 用 (多个候选源)
          for U in "https://github.com/moparisthebest/static-curl/releases/latest/download/curl-linux-x86_64-glibc" \
                   "https://github.com/stunnel/static-curl/releases/latest/download/curl-linux-x86_64-glibc"; do
            curl -sfL -o guest-curl "$U" && file guest-curl | grep -q "ELF" && { echo "got: $U"; break; }
          done
          ls -la guest-curl 2>/dev/null || echo "NO-GUEST-CURL"

      - name: Pre-install system image (before WARP)
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;37.0.0" "emulator" "system-images;android-34;google_apis_playstore;x86_64" 2>&1 | tail -3
          sdkmanager --list_installed 2>/dev/null | grep google_apis_playstore || echo "IMAGE-MISSING"

      - name: Cloudflare WARP (bypass CF block of GH IPs)
        run: |
          CODENAME=$(lsb_release -cs)
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-main.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflareclient.com/ $CODENAME main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode warp
          warp-cli --accept-tos connect
          sleep 6
          warp-cli --accept-tos status || true
          echo "--- egress check ---"
          curl -s --max-time 15 https://www.cloudflare.com/cdn-cgi/trace | grep -E "ip=|warp=" || true
          echo "--- fmcs check ---"
          curl -s --max-time 20 -A "FMCS-App" https://api.freemcserver.net/v4/app-settings/credits | head -c 200; echo

      - name: Start tinyproxy (emulator egress via WARP, avoid guest IPv6 blackhole)
        run: |
          sudo apt-get install -y -qq tinyproxy
          echo 'LogLevel Info' | sudo tee -a /etc/tinyproxy/tinyproxy.conf
          sudo systemctl start tinyproxy && sleep 2
          curl -s --max-time 10 -x http://127.0.0.1:8888 -A FMCS-App https://api.freemcserver.net/v4/app-settings/credits | head -c 120; echo " <- proxy check"

      - name: Launch emulator (raw, visible logs)
        env:
          FMCS_USER: ${{ secrets.FMCS_USER }}
          FMCS_PASS: ${{ secrets.FMCS_PASS }}
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          # 手工创建 AVD (绕开 avdmanager 的目录不一致问题)
          mkdir -p $HOME/.android/avd/test.avd
          cat > $HOME/.android/avd/test.ini <<EOF
          avd.ini.encoding=UTF-8
          path=$HOME/.android/avd/test.avd
          path.rel=avd/test.avd
          target=android-34
          EOF
          cat > $HOME/.android/avd/test.avd/config.ini <<EOF
          avd.ini.encoding=UTF-8
          abi.type=x86_64
          hw.cpu.arch=x86_64
          image.sysdir.1=system-images/android-34/google_apis_playstore/x86_64/
          tag.display=Google Play
          tag.id=google_apis_playstore
          hw.lcd.density=440
          hw.lcd.width=1080
          hw.lcd.height=2340
          hw.ramSize=3072
          hw.cpu.ncore=2
          hw.gpu.enabled=yes
          hw.gpu.mode=swiftshader_indirect
          disk.dataPartition.size=6G
          EOF
          sed -i 's/^          //' $HOME/.android/avd/test.ini $HOME/.android/avd/test.avd/config.ini
          ls -la $HOME/.android/avd/
          sudo tcpdump -i any -w fms.pcap 'tcp port 443' &
          echo $! > tcpdump.pid
          nohup $ANDROID_HOME/emulator/emulator -avd test -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics -port 5554 > emu.log 2>&1 &
          echo "emulator pid: $!"
          sleep 20
          timeout 60 adb wait-for-device || echo "wait-for-device TIMEOUT (continuing)"
          BOOT=0
          for i in $(seq 1 90); do
            B=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$B" = "1" ]; then BOOT=1; echo "boot completed at ${i}0s"; break; fi
            sleep 10
          done
          echo "BOOT=$BOOT"
          tail -5 emu.log || true
          if [ "$BOOT" != "1" ]; then echo "EMU-BOOT-FAILED"; tail -40 emu.log; exit 1; fi

      - name: Run diagnosis (probe) or full flow
        env:
          FMCS_USER: ${{ secrets.FMCS_USER }}
          FMCS_PASS: ${{ secrets.FMCS_PASS }}
        timeout-minutes: 18
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          mkdir -p ui
          if [ "${{ inputs.mode }}" = "probe" ]; then python3 driver/probe.py; else python3 driver/fms_ui.py "${{ inputs.mode }}"; fi

      - name: Stop emulator + tcpdump
        if: always()
        run: |
          $ANDROID_HOME/platform-tools/adb emu kill 2>/dev/null || true
          sleep 3
          sudo kill $(cat tcpdump.pid) 2>/dev/null || true
          pkill -f qemu-system 2>/dev/null || true
          tail -15 emu.log || true
          echo "===== FMCS 443 流量分析 (104.26.0.0/16) ====="
          tcpdump -r fms.pcap -nn 2>/dev/null | grep -E "104\.26\.(0|1)\." | tail -50
          echo "===== 流量统计 ====="
          tcpdump -r fms.pcap -nn 2>/dev/null | grep -cE "104\.26\.(0|1)\." || true

      - name: Upload UI dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-dumps
          path: |
            ui/
            logcat.txt
            proxy.log
            fms.pcap
